name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g., v0.6.0). Must match an existing commit + package.json.'
        type: string
        required: true
      dry-run:
        description: 'Build artifacts but skip gh release create'
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}
      - name: Derive version
        id: derive
        run: |
          V="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile --linker hoisted
      - name: Assert package.json matches tag
        run: |
          V="${{ steps.derive.outputs.version }}"
          PKG=$(bun -e "console.log(require('./package.json').version)")
          EXPECTED="v$PKG"
          if [ "$V" != "$EXPECTED" ]; then
            echo "::error::tag $V does not match package.json $PKG (expected tag $EXPECTED)"
            exit 1
          fi
          echo "OK: tag $V matches package.json $PKG"
      - run: bun run lint
      - run: bun run typecheck
      # Item 2 — skip the env-flaky tuiLauncher integration smokes at the
      # release gate only (SOV_SKIP_FLAKY). Dev still runs them on a bare
      # `bun test`; they can die against the global 20s budget on a
      # constrained runner and needlessly block a release.
      - name: Test suite
        env:
          SOV_SKIP_FLAKY: '1'
        run: bun run test
      # backlog #56 — guard the Go (sov-tui) suite in CI. The release CI only
      # `go build`s the TUI, so Go test regressions (e.g. the stale theme-switch
      # test) surfaced only on a developer's machine. Run it as part of the gate.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Go suite (sov-tui)
        working-directory: packages/tui
        run: go test ./...

  build-darwin:
    name: build-darwin
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout sovereign-ai-sdk
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read reviewed license revision
        id: license-source
        shell: bash
        run: python -c "import json; print('revision=' + json.load(open('scripts/release-license.json'))['revision'])" >> "$GITHUB_OUTPUT"
      - name: Checkout reviewed consumer license
        uses: actions/checkout@v5
        with:
          repository: yevgetman/sov-releases
          ref: ${{ steps.license-source.outputs.revision }}
          path: sov-releases
          token: ${{ secrets.SOV_RELEASES_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - run: bun install --frozen-lockfile --linker hoisted
      - name: Build darwin-arm64
        env:
          SOV_RELEASES_PATH: ${{ github.workspace }}/sov-releases
        run: bun run release:build darwin-arm64 ${{ needs.preflight.outputs.version }}
      - name: Build darwin-x64
        env:
          SOV_RELEASES_PATH: ${{ github.workspace }}/sov-releases
        run: bun run release:build darwin-x64 ${{ needs.preflight.outputs.version }}
      - name: Native smoke (darwin-arm64 --version)
        run: |
          V="${{ needs.preflight.outputs.version }}"
          OUT=$("./build/release/$V/darwin-arm64/bin/sov" --version)
          echo "smoke output: $OUT"
          # The version string starts with the bare semver (sans leading "v").
          BARE="${V#v}"
          case "$OUT" in
            "$BARE"*) echo "OK: --version starts with $BARE" ;;
            *) echo "::error::--version output '$OUT' does not start with $BARE"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v6
        with:
          name: tarballs-darwin
          path: build/release/${{ needs.preflight.outputs.version }}/sov-darwin-*.tar.gz
          if-no-files-found: error

  build-linux:
    name: build-linux
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout sovereign-ai-sdk
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read reviewed license revision
        id: license-source
        shell: bash
        run: python -c "import json; print('revision=' + json.load(open('scripts/release-license.json'))['revision'])" >> "$GITHUB_OUTPUT"
      - name: Checkout reviewed consumer license
        uses: actions/checkout@v5
        with:
          repository: yevgetman/sov-releases
          ref: ${{ steps.license-source.outputs.revision }}
          path: sov-releases
          token: ${{ secrets.SOV_RELEASES_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - run: bun install --frozen-lockfile --linker hoisted
      - name: Build linux-x64
        env:
          SOV_RELEASES_PATH: ${{ github.workspace }}/sov-releases
        run: bun run release:build linux-x64 ${{ needs.preflight.outputs.version }}
      # Item 2 — cross-compile linux-arm64 in the same ubuntu job. The Go TUI
      # is pure-Go (no cgo), so the target cross-compiles cleanly here without a
      # separate arm64 runner. The native `--version` smoke below stays x64-only
      # (this box can't exec an arm64 binary); arm64 is validated downstream at
      # the Appleo build's SHA check + container run.
      - name: Build linux-arm64
        env:
          SOV_RELEASES_PATH: ${{ github.workspace }}/sov-releases
        run: bun run release:build linux-arm64 ${{ needs.preflight.outputs.version }}
      - name: Native smoke (linux-x64 --version)
        run: |
          V="${{ needs.preflight.outputs.version }}"
          OUT=$("./build/release/$V/linux-x64/bin/sov" --version)
          echo "smoke output: $OUT"
          BARE="${V#v}"
          case "$OUT" in
            "$BARE"*) echo "OK: --version starts with $BARE" ;;
            *) echo "::error::--version output '$OUT' does not start with $BARE"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v6
        with:
          name: tarballs-linux
          path: build/release/${{ needs.preflight.outputs.version }}/sov-linux-*.tar.gz
          if-no-files-found: error

  build-windows:
    name: build-windows
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 25
    # Telekit for Windows (telekit specs/2026-08-24-windows-support-design.md
    # §5.3). Built natively so the `--version` smoke below exercises the real
    # `sov.exe` on Windows, and the zip is unpacked with Windows' own
    # Expand-Archive to prove the hand-rolled writer (scripts/release-zip.ts)
    # produces an archive a stock Windows box can open.
    defaults:
      run:
        shell: pwsh
    steps:
      # Scanner and consumer-license pins hash exact Git bytes on every platform.
      - name: Preserve LF bytes in Windows checkouts
        run: git config --global core.autocrlf false
      - name: Checkout sovereign-ai-sdk
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read reviewed license revision
        id: license-source
        shell: bash
        run: python -c "import json; print('revision=' + json.load(open('scripts/release-license.json'))['revision'])" >> "$GITHUB_OUTPUT"
      - name: Checkout reviewed consumer license
        uses: actions/checkout@v5
        with:
          repository: yevgetman/sov-releases
          ref: ${{ steps.license-source.outputs.revision }}
          path: sov-releases
          token: ${{ secrets.SOV_RELEASES_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - run: bun install --frozen-lockfile --linker hoisted
      - name: Build windows-x64
        env:
          SOV_RELEASES_PATH: ${{ github.workspace }}/sov-releases
        run: bun run release:build windows-x64 ${{ needs.preflight.outputs.version }}
      - name: Native smoke (windows-x64 --version)
        run: |
          $V = "${{ needs.preflight.outputs.version }}"
          $Out = (& ".\build\release\$V\windows-x64\bin\sov.exe" --version | Out-String).Trim()
          Write-Host "smoke output: $Out"
          # The version string starts with the bare semver (sans leading "v").
          $Bare = $V.TrimStart('v')
          if (-not $Out.StartsWith($Bare)) {
            Write-Host "::error::--version output '$Out' does not start with $Bare"
            exit 1
          }
          Write-Host "OK: --version starts with $Bare"
      - name: Zip layout smoke (Expand-Archive)
        run: |
          $V = "${{ needs.preflight.outputs.version }}"
          $Zip = ".\build\release\$V\sov-windows-x64.zip"
          $Dest = Join-Path $env:RUNNER_TEMP "sov-zip-smoke"
          Expand-Archive -Path $Zip -DestinationPath $Dest -Force
          foreach ($p in @('bin\sov.exe', 'bin\sov-tui.exe', 'bundle-default\index.yaml', 'version', 'LICENSE.txt', 'README.md')) {
            if (-not (Test-Path (Join-Path $Dest $p))) {
              Write-Host "::error::zip is missing $p"
              exit 1
            }
          }
          $Extracted = (Get-Content (Join-Path $Dest 'version') -Raw).Trim()
          if ($Extracted -ne $V) {
            Write-Host "::error::extracted version '$Extracted' != $V"
            exit 1
          }
          Write-Host "OK: zip layout matches the tarballs"
      - uses: actions/upload-artifact@v6
        with:
          name: tarballs-windows
          path: build/release/${{ needs.preflight.outputs.version }}/sov-windows-*.zip
          if-no-files-found: error

  release:
    name: release
    needs: [build-darwin, build-linux, build-windows, preflight]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout sovereign-ai-sdk
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.version }}
      - name: Checkout sov-releases
        uses: actions/checkout@v5
        with:
          repository: yevgetman/sov-releases
          ref: main
          path: sov-releases
          token: ${{ secrets.SOV_RELEASES_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile --linker hoisted
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: tarballs-*
          merge-multiple: true
          path: build/release/${{ needs.preflight.outputs.version }}
      - name: List downloaded artifacts
        run: ls -la build/release/${{ needs.preflight.outputs.version }}/
      - name: Upload release
        env:
          GH_TOKEN: ${{ secrets.SOV_RELEASES_TOKEN }}
          SOV_RELEASES_PATH: ${{ github.workspace }}/sov-releases
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry-run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          bun run release:upload ${{ needs.preflight.outputs.version }} $DRY_FLAG
