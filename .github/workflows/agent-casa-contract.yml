name: Agent Casa downstream contract

# Requires a repository-scoped read token for the PRIVATE consumer. No token is
# available on fork PRs, and no private source is put in public test fixtures.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downstream:
    name: actual Agent Casa consumer
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: sdk
          persist-credentials: false
      - name: Require private consumer access
        env:
          READ_TOKEN: ${{ secrets.AGENT_CASA_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo '::error::Configure AGENT_CASA_READ_TOKEN with read-only access to real-estate-agent-runtime.'
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: yevgetman/real-estate-agent-runtime
          path: agent-casa
          token: ${{ secrets.AGENT_CASA_READ_TOKEN }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: sdk
      - run: node scripts/canary/run-agent-casa-canary.mjs ../agent-casa
        working-directory: sdk
